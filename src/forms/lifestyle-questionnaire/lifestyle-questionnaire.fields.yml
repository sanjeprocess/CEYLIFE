question4:
  type: radio-group
  label: "04) Have you taken any treatment for alcohol addiction? (If so give the names of the doctors and treated durations)"
  required: false
  options:
    Yes: "Yes"
    No: "No"
  dependencies:
    question4Details:
      type: textarea
      label: Please provide details
      required: true
      conditionalOptions:
        operator: eq
        value: "Yes"

