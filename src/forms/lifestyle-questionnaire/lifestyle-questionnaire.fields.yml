# lifestyle-questionnaire form fields

proposerName:
  type: text
  label: PROPOSER'S NAME
  required: false
  placeholder: Enter proposer's name
  defaultValue: "{{full_name}}"
  readOnly: true

contractNumber:
  type: text
  label: CONTRACT NUMBER
  required: false
  placeholder: Enter contract number
  defaultValue: "{{contract_number}}"
  readOnly: true

title:
  type: text
  label: " "
  required: false
  placeholder: Enter title
  defaultValue: "{{full_name}}/{{policy_no}}"
  readOnly: true

nicNumber:
  type: text
  label: NIC NUMBER
  required: true
  placeholder: Enter NIC number

question1:
  type: radio-group
  label: "01) Are you consuming alcoholic beverages?"
  required: false
  options:
    Yes: "Yes"
    No: "No"

question2:
  type: text
  label: "02) If so, When did you start taking alcohol?"
  required: false
  placeholder: "Enter date or details"
  dependsOn: question1
  conditionalOptions:
    operator: eq
    value: "Yes"
question3A:
  type: radio-group
  label: "A) How often do you consume liquor"
  required: false
  options:
    Daily: "Daily"
    Weekly: "Weekly"
    Monthly: "Monthly"
    Occasionally: "Occasionally"
  dependsOn: question1
  conditionalOptions:
    operator: eq
    value: "Yes"
