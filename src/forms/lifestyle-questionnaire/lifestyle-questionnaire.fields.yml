question7:
  type: textarea
  label: "07) How is you general health?"
  required: true
  placeholder: Describe general health

question8:
  type: radio-group
  label: "08) Have you had any convictions for bad Driving for alcohol addiction? If so, give full details with dates etc."
  required: false
  options:
    Yes: "Yes"
    No: "No"
  dependencies:
    question8Details:
      type: textarea
      label: Please provide details
      required: true
      conditionalOptions:
        operator: eq
        value: "Yes"

question9:
  type: radio-group
  label: "09) Have you had any accidents for alcohol addiction? If so, give full details with dates etc."
  required: false
  options:
    Yes: "Yes"
    No: "No"
  dependencies:
    question9Details:
      type: textarea
      label: Please provide details
      required: true
      conditionalOptions:
        operator: eq
        value: "Yes"

question10:
  type: radio-group
  label: "10) Have you been convicted in a court of low for any other offence, Or wanted by law enforcement authorities for misconduct? If so, give full details with dates etc."
  required: false
  options:
    Yes: "Yes"
    No: "No"
  dependencies:
    question10Details:
      type: textarea
      label: Please provide details
      required: true
      conditionalOptions:
        operator: eq
        value: "Yes"

question11:
  type: radio-group
  label: "11) Do you / Have you Smoke / Smoked Cigarettes, Cigars or beedis?"
  required: false
  options:
    Yes: "Yes"
    No: "No"
  dependencies:
    question11Details:
      type: textarea
      label: Please provide details
      required: true
      conditionalOptions:
        operator: eq
        value: "Yes"

submittedDate:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true

signature:
  type: adjustableImage
  label: Signature of the life Assured
  required: true
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp
