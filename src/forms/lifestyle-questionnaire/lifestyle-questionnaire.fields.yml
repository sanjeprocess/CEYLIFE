questionBeerQuantity:
  type: radio-group
  label: "C) Quantity (Beer)"
  required: false
  options:
    "1/4_Bottle": "1/4 Bottle"
    "1/2_Bottle": "1/2 Bottle"
    "1-2_Bottle": "1-2 Bottle"
    "2-6_Bottle": "2-6 Bottle"
    "7+_Bottle": "7+ Bottle"
    "Other": "Other"
  dependsOn: question1
  conditionalOptions:
    operator: eq
    value: "Yes"
  dependencies:
    questionBeerQuantityDetails:
      type: textarea
      label: "Please provide details"
      required: false
      conditionalOptions:
        operator: eq
        value: "Other"

