# military-claused form fields
# Types: text, number, email, password, date, time, datetime-local, checkbox, radio-group, checkbox-group, select, textarea, file, url, tel

topDate:
  type: date
  label: ""
  required: true
  placeholder: Enter Date


name:
  type: text
  label: ""
  required: false
  placeholder: Enter Name
  defaultValue: "{{client_name}}"
  readOnly: true


address:
  type: text
  label: ""
  required: true
  placeholder: Enter Address

policyNo:
  type: text
  label: "LIFE ASSURANCE POLICY NO"
  required: true
  placeholder: Enter Policy No
  defaultValue: "{{policy_no}}"
  readOnly: true

assuredName:
  type: text
  label: "LIFE ASSURED'S NAME"
  required: true
  placeholder: Enter Assured Name
  defaultValue: "{{client_name}}"

signature:
  type: adjustableImage
  label: Signature of the life to be assured/Proposer
  required: true
  defaultValue: ""
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp
date:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true