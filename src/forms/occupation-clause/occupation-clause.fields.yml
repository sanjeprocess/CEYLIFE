# occupation-clause form fields

ProposerName:
  type: text
  label: Proposer's Name
  required: true
  placeholder: Proposer's Name
  defaultValue: "{{client_name}}"
  readOnly: true
contractNumber:
  type: text
  label: Contract Number
  required: true
  placeholder: Contract Number
  defaultValue: "{{contract_number}}"

nicNumber:
  type: text
  label: NIC Number
  required: true
  placeholder: Enter NIC Number
  defaultValue: ""
date:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true
signature:
  type: adjustableImage
  label: Signature
  required: true
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp
