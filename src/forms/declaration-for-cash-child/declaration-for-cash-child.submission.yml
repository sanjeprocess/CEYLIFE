    to: title
    returnType: string
    script: |
      if (value) {
          value = value.replaceAll(' ', '_');
          return value;
      }
      return 'title_not_generated';

  - from: nameOfChild
    to: nameOfChild
    returnType: string

  - from: dateOfBirth
