# declaration-for-cash-child from submission

baseUrl: https://lk.workhub24.com
endpoint: /api/workflows/MB4EALVIJI66HLKVX6LISPLOZ6HYZL6C/w73a7027ba4/cards
method: POST
requiresAccessToken: true
contentType: multipart/form-data

headers:
