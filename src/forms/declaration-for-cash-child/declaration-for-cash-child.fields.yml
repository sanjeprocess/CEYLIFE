fathersNic:
  type: text
  label: "NIC"
  placeholder: "NIC"
  required: true

nameWithInitial:
  type: text
  label: "Name with initials"
  placeholder: "Name with initials"
  required: true

submittedPlace:
  type: text
  label: "Submitted Place"
  placeholder: "Submitted Place"
  required: true

submittedDate:
  type: date
  label: "Date"
  placeholder: "Date"
  required: true
  readOnly: true
  defaultValue: "{{$today}}"

mothersNic:
  type: text
  label: "Mothers NIC"
  placeholder: "Mothers NIC"
  required: false

witness1Signature:
  type: adjustableImage
  label: "Signature"
  placeholder: "Witness 1 Signature"
  required: true
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp

witness1Name:
  type: text
  label: "Witness 1 Name"
  placeholder: "Witness 1 Name"
  required: true

witness1Address:
  type: text
  label: "Witness 1 Address"
  placeholder: "Witness 1 Address"
  required: true

witness1Nic:
  type: text
  label: "Witness 1 NIC"
  placeholder: "Witness 1 NIC"
  required: true

