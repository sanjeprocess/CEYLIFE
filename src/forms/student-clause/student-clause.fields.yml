# student-claused form fields
# Types: text, number, email, password, date, time, datetime-local, checkbox, radio-group, checkbox-group, select, textarea, file, url, tel

proposerName:
  type: text
  label: "Proposer Name"
  required: false
  placeholder: "Enter Proposer Name"
  defaultValue: "{{client_name}}"
  readOnly: true

proposerNic:
  type: text
  label: "Proposer NIC Number"
  required: false
  placeholder: "Enter Proposer NIC Number"
  

proposerContract:
  type: text
  label: "Proposer Contract"
  required: false
  placeholder: "Enter Proposer Contract Number"
  defaultValue: "{{policy_no}}"
  readOnly: true

signature:
  type: adjustableImage
  label: Signature of Proposer
  required: true
  defaultValue: ""
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp
date:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true