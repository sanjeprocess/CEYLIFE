# pregnancy-questionaire form fields
# Types: text, number, email, password, date, time, datetime-local, checkbox, radio-group, checkbox-group, select, textarea, file, url, tel
proposersName:
  type: text
  label: "Proposer's Name"
  required: true
  placeholder: "Proposer's Name"
  defaultValue: "{{client_name}}"

contractNumber:
  type: text
  label: "Contract Number"
  required: true
  placeholder: "Contract Number"
  defaultValue: "{{contract_number}}"
  readOnly: true

firstDateOfMenstrualPeriod:
  type: date
  label: "3. Date of first date of the last menstrual period"
  required: true

deliveryDate:
  type: date
  label: "4. Expected date of delivery"
  required: true

beingTreatedOrCloselyMonitored:
  type: radio-group
  label: "3. Are you being-treated or closely monitored due to elevated blood pressure, diabetes or for any other pregnant related complications?"
  required: true
  options:
    Yes: Yes
    No: No
  dependencies:
    beingTreatedOrCloselyMonitoredDetails:
      type: textarea
      label: Details
      required: true
      placeholder: Please give details and forward related medical reports.
      conditionalOptions:
        operator: eq
        value: Yes

abnormalitiesPertaining: 
  type: radio-group
  label: "6. Are you aware of any abnormalities pertaining to current pregnancy? If so, please give details. "
  required: true
  options:
    Yes: Yes
    No: No
  dependencies:
    abnormalitiesDetails:
      type: textarea
      label: Details
      required: true
      placeholder: Enter Details
      conditionalOptions:
        operator: eq
        value: Yes

haveChildren:
  type: radio-group
  label: 1. Do you have  children? If Yes, state the number. 
  required: true
  options:
    Yes: Yes
    No: No
  dependencies:
    childrenNo:
      type: number
      label: Number of Children
      required: true
      placeholder: Enter Number of Children
      conditionalOptions:
        operator: eq
        value: Yes

prematureBirth:
  type: radio-group
  label: 2. Were there any premature births?
  required: true
  options:
    Yes: Yes
    No: No

treatedforPregnancyRelatedComplications:
  type: radio-group
  label: 3. During past pregnancy/ies, were you treated for elevated blood pressure, blood sugar or any adverse urine / blood reports or other illness/es? If so, please give details. 
  required: true
  options:
    Yes: Yes
    No: No
  dependencies:
    complicationsDetails:
      type: textarea
      label: Details
      required: true
      placeholder: Enter Details
      conditionalOptions:
        operator: eq
        value: Yes


date:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true

signature:
  type: adjustableImage
  label: Signature of the life to be assured
  required: true
  defaultValue: ""
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp