# travel-and-residence-questionnaire form fields
# Types: text, number, email, password, date, time, datetime-local, checkbox, radio-group, checkbox-group, select, textarea, file, url, tel
contractNum:
  type: text
  label: Contract Number
  required: true
  validation:
    minLength: 3
    maxLength: 100
  defaultValue: "{{contract_number}}"
  readOnly: true
fullName:
  type: text
  label: Full Name
  required: true
  placeholder: Enter Full Name
  defaultValue: "{{full_name}}"
  readOnly: true

currentResidence:
  type: text
  label: 1.) Please provide details of your current residency and your residency status including information of length of stay by visa etc,if appropriate
  required: true
  placeholder: Enter Current Residence

occupationalDuties:
  type: textarea
  label: "4.) Please provide a brief description of your occupational duties and/ or any other activities you will participate in whilst travelling or residing abroad"
  required: true

majorityOfTimeSpent:
  type: radio-group
  label: 5.) Do you expect to spend the majority of your time in major / large cities? If NO, please provide the name of the town/ region and details of your likely accommodation, availability of medical facilities and your internal travel arrangements (e.g. light aircraft, boat etc.)
  required: true
  options:
    Yes: Yes
    No: No
  dependencies:
    townRegionDetails:
      type: textarea
      label: " "
      required: true
      placeholder: Enter Town/Region Details
      validation:
        maxLength: 1000
      conditionalOptions:
        operator: eq
        value: No

medicalDetails:
  type: textarea
  label: 6.) Please give details of any medical treatment or surgery you have received whilst resident overseas
  required: true
  placeholder: Enter Medical Details

additionalInformation:
  type: textarea
  label: 7.) Please provide any additional information on your residence and travel which you feel may be helpful in processing your application
  required: true
  placeholder: Enter Additional Information

signature:
  type: adjustableImage
  label: Signature of Proposer
  required: true
  defaultValue: ""
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp
date:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true

previousResidence:
  type: table
  label: 2.)Please provide details of your previous residence and travel during the last 5 years (excluding holidays of less than 4 weeks )
  required: false
  description: " "
  minRows: 0
  defaultRows: 0
  columns:
    - key: 2aDatesOfStay
      type: textarea
      label: a) Dates of stay
      required: true
      placeholder: Enter Dates of Stay of Previous Residence

    - key: 2bCountryAndRegionOfResidence
      type: textarea
      label: b) Country and region of residence
      required: true
      placeholder: Enter Country and Region of Previous Residence

    - key: 2cReasonForVisiting
      type: textarea
      label: c) Reason for visiting
      required: true
      placeholder: Enter Reason for Visiting

    - key: 2dFrequencynumberOfTripsPerYear
      type: textarea
      label: d) Frequency (number of trips per year)
      required: true
      placeholder: Enter Frequency of Visits

    - key: 2eDurationOfEachStay
      type: textarea
      label: e) Duration of each stay
      required: true
      placeholder: Enter Duration of each stay

futureResidence:
  type: table
  label: 3.) Please provide details of your future residence and travel intentions during the next 5 years (excluding holidays of less than 4 weeks )
  required: false
  description: " "
  minRows: 0
  defaultRows: 0
  columns:
    - key: 3aDatesOfStay
      type: textarea
      label: a) Dates of stay
      required: true
      placeholder: Enter Dates of Stay of Previous Residence

    - key: 3bCountryAndRegionOfResidence
      type: textarea
      label: b) Country and region of residence
      required: true
      placeholder: Enter Country and Region of Previous Residence

    - key: 3cReasonForVisiting
      type: textarea
      label: c) Reason for visiting
      required: true
      placeholder: Enter Reason for Visiting

    - key: 3dFrequencynumberOfTripsPerYear
      type: textarea
      label: d) Frequency (number of trips per year)
      required: true
      placeholder: Enter Frequency of Visits

    - key: 3eDurationOfEachStay
      type: textarea
      label: e) Duration of each stay
      required: true
      placeholder: Enter Duration of each stay
