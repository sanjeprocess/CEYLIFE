signature:
  type: adjustableImage
  label: Signature sample
  required: false
  description: Take a photo or upload an image, then adjust the frame to include only the signature. Mapped to multipart field `signature`.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp

