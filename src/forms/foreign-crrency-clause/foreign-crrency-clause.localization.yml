  # Layout translations
  h2.foreign_currency_heading: "புலம்பெயர் காப்புறுதியாளருக்கான பணம்செலுத்துதல்"
  text.foreign_currency_clause_body: >-
    ஆயுள் காப்புறுதி பெற முன்மொழியப்பட்டுள்ள,  .................................................................சேர்ந்த கீழே கையொப்பமிட்டுள்ள .................................................................................. என்ற நான், இந்த காப்புறுதி தொடர்பாக எனக்கு அல்லது என்னைச் சார்ந்தவர்களுக்கு செலுத்த வேண்டிய அனைத்துப் பணமும், அத்தகைய பணம் செலுத்தப்படும் போதெல்லாம், இலங்கையில், இலங்கை நாணயத்தில் செலுத்தப்படும் என்ற இலங்கையின் நடைமுறையில் உள்ள அந்நியச்செலவாணி கட்டுப்பாட்டு விதிமுறைகளை முழுமையாக அறிந்துதிருக்கின்றேன் என்பதை இதன் மூலம் தெரிவிக்கின்றேன், மேலும், இந்த நிபந்தனைகளுக்கும், அவ்வப்போது அந்நியச்செலவாணி கட்டுப்பாட்டு விதிமுறைகளில் மேலதிகமாக இணைக்கப்படக்கூடிய எந்த மாற்றங்களுக்கும் நான் உடன்படுகின்றேன் என்றும்; இந்த காப்புறுதி தொடர்பான அனைத்துப் பணத்தையும் செலுத்துவது இந்த நிபந்தனைகளுக்கு உட்பட்டது என்றும், இந்த அறிவிப்பு 
  foreign_currency_clause_body.limited_on_date: "அன்று செலிங்கோ லைஃப் இன்சூரன்ஸ் லிமிடெட்டிற்கு நான் செய்த காப்புறுதிக்கான முன்மொழிவின் ஒரு பகுதியாக இருக்கும் என்றும், மூல முன்மொழிவில் உள்ளதைப் போலவே அதே விளைவைக் கொண்டிருக்கும் என்றும் அறிவிக்கின்றேன்."
  text.form_explained: >-
    இந்தப் படிவத்தின் உள்ளடக்கங்களை முன்மொழிபவருக்கு நான் விளங்கப்படுத்தியதுடன், அவர் அதை முழுமையாகப் புரிந்துகொண்ட பின்னர் தனது கையொப்பத்தை இட்டுள்ளார்.
  submit.button: "படிவத்தை சமர்ப்பிக்கவும்"
  reset.button: " படிவத் தரவை மீளமைக்கவும்"
