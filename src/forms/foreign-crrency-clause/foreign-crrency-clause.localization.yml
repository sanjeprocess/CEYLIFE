  text.foreign_currency_clause_body_second_text: >-
    හි පදිංචි {{client_name}} නමැති මම, යෝජිත ජීවිත රක්ෂණය සඳහා මෙහි පහත අත්සන් තබන ලද අතර, මෙම රක්ෂණ සහතිකය මත මා වෙත හෝ මාගේ යැපෙන්නන් වෙත හෝ ගෙවීමට නියමිත වන සියලු මුදල් සම්බන්ධයෙන් දැනට **ශ්‍රී ලංකාවේ පවතින විනිමය පාලන රෙගුලාසි** සහ එවැනි මුදලක් ගෙවිය යුතු වන අවස්ථාවක දී එම මුදල ශ්‍රී ලංකාව තුළ දී, ශ්‍රී ලංකාවේ ව්‍යවහාර මුදලින් ගෙවනු ඇති බවට මම පූර්ණ වශයෙන් දැනුවත් බව මෙමගින් ප්‍රකාශ කරමි.  තවද, මෙකී කොන්දේසි වලට සහ විනිමය පාලන රෙගුලාසි වෙත කලින් කලට ඇතුළත් කරනු ඇති යම් වෙනස් කිරීම් හෝ එකතු කිරීම් වලට මම එකඟ වන බවත්; මෙම රක්ෂණ සහතිකය සම්බන්ධයෙන් ගෙවීමට නියමිත වන සියලු මුදල් මෙකී කොන්දේසි වලට විෂය වන බවත්, සහ මෙම ප්‍රකාශනය මගින්,
  
  
  foreign_currency_clause_body.limited_on_date: "දින දී සෙලින්කෝ ලයිෆ් ඉන්ෂුවරන්ස් ලිමිටඩ් සමාගම වෙත මා විසින් සිදු කරන ලද රක්ෂණ යෝජනාවලියෙහි කොටසක් නිර්මාණය කෙරෙන බවත්, එය මුල් රක්ෂණ යෝජනාවලියෙහි අඩංගු කළ හා සමාන බලපැවැත්වීමකින් යුතු වන බවත් මම ප්‍රකාශ කරමි."
