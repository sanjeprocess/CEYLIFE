# foreign-crrency-clause form fields
# Types: text, number, email, password, date, time, datetime-local, checkbox, radio-group, checkbox-group, select, textarea, file, url, tel

proposersName:
  type: text
  label: "Proposer's Name"
  required: false
  placeholder: "Proposer's Name"
  defaultValue: "{{client_name}}"

contractNumber:
  type: text
  label: "Contract Number"
  required: false
  placeholder: "Contract Number"
  defaultValue: "{{contract_number}}"
  readOnly: true

address:
  type: textarea
  label: Address
  required: true
  placeholder: Enter Address

limitedOnDate:
  type: date
  required: true
  label: ""

proposerDate:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true
proposerSignature:
  type: adjustableImage
  label: Signature of the proposer
  required: true
  defaultValue: ""
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp

