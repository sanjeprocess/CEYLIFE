# threat-clause form fields
# Types: text, number, email, password, date, time, datetime-local, checkbox, radio-group, checkbox-group, select, textarea, file, url, tel

proposerName:
  type: text
  label: Proposer Name
  required: true
  placeholder: Enter Proposer Name
  defaultValue: "{{client_name}}"

proposerContract:
  type: text
  label: Contract Number
  required: true
  placeholder: Enter Contract Number
  defaultValue: "{{contract_number}}"

proposerNic:
  type: text
  label: NIC Number
  required: true
  placeholder: Enter NIC

date:
  type: date
  label: Date
  required: true
  placeholder: Date
  defaultValue: "{{$today}}"
  readOnly: true

signature:
  type: adjustableImage
  label: Signature of Life Assured
  required: true
  description: Take a photo or upload an image, then adjust the frame to include only the signature.
  fileOptions:
    maxSize: 10485760
    allowedExtensions:
      - png
      - jpg
      - jpeg
      - webp
